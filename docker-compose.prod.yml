services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/bridge.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  webapp:
    image: ghcr.io/cme-research/cmeresearch_amr_webcontrol:${WEBAPP_VERSION:?WEBAPP_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexa-webapp
    restart: unless-stopped
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  brickd:
    image: ghcr.io/cme-research/cmexa_brickd:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexa-brickd
    restart: unless-stopped
    network_mode: host
    privileged: true
    device_cgroup_rules:
      - 'c 189:* rmw'
    volumes:
      - /dev/bus/usb:/dev/bus/usb

  hardware:
    image: ghcr.io/cme-research/cmexa_hardware:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexaiii-hardware
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    depends_on:
      mosquitto:
        condition: service_healthy
      brickd:
        condition: service_started
    volumes:
      - /dev/input:/dev/input
    device_cgroup_rules:
      - 'c 189:* rmw'
    group_add:
      - "${INPUT_GID}"
    environment:
      - ROBOT=cmexaiii
      - ROBOT_ENV=house
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ros2_control_node >/dev/null && pgrep -f robot_state_publisher >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  nav:
    image: ghcr.io/cme-research/cmexa_nav:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexaiii-nav
    restart: unless-stopped
    network_mode: host
    ipc: host
    depends_on:
      hardware:
        condition: service_healthy
    command: ros2 launch cmeresearch_bringup ${LAUNCH_FILE:-cmexaiii_nav_mapping.launch.py}
    volumes:
      - /robot/data/maps:/maps

volumes:
  mosquitto_data:
  mosquitto_log:
