services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/bridge.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  webapp:
    image: ghcr.io/cme-research/cmexa_webapp:latest
    container_name: cmexa-webapp
    restart: unless-stopped
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  robot:
    image: ghcr.io/cme-research/cmexa_install:latest
    container_name: cmexaiii-robot
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - /dev/input:/dev/input
    device_cgroup_rules:
      - 'c 189:* rmw'

volumes:
  mosquitto_data:
  mosquitto_log:
