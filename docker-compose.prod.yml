services:

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/bridge.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      # Connect via the container's own non-loopback IP. mosquitto_sub without
      # -h defaults to localhost (lo), which would still pass even if the
      # listener is misconfigured as `listener 1883 localhost` and therefore
      # unreachable from outside the container. $(hostname -i) fails the
      # check in that broken state.
      test: ["CMD-SHELL", "mosquitto_sub -h \"$$(hostname -i | awk '{print $$1}')\" -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Least-privilege Docker API in front of the raw socket. Bound to localhost
  # only (the host-networked webapp reaches it at 127.0.0.1:2375); the LAN/VPN
  # cannot. Only the verbs `docker compose up` + `docker logs` need are enabled.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: cmexa-socket-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - NETWORKS=1
      - VOLUMES=1
      - INFO=1
      - VERSION=1
      - PING=1
      - POST=1        # required for create/start/recreate
      - BUILD=0
      - EXEC=0
      - SWARM=0
      - SYSTEM=0
      - SECRETS=0
      - CONFIGS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  webapp:
    image: ghcr.io/cme-research/cmeresearch_amr_webcontrol:${WEBAPP_VERSION:?WEBAPP_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexa-webapp
    restart: unless-stopped
    network_mode: host
    depends_on:
      mosquitto:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    environment:
      # Selects app_config.<instance>.json inside the image so one webapp image
      # serves any robot (falls back to app_config.json if no match).
      - ROBOT_INSTANCE=${ROBOT_INSTANCE:-cmexaiii-001}
      # robot.yaml lives in the deploy dir (mounted below at its own host path).
      - ROBOT_CONFIG_FILE=${DEPLOY_DIR:?DEPLOY_DIR must be set by deploy.sh}/robot.yaml
      # One-click Apply: recreate containers via the socket-proxy, using the
      # compose file in the deploy dir. DEPLOY_DIR is the host path so compose
      # bind-mount paths resolve identically inside the webapp and on the host.
      - DEPLOY_DIR=${DEPLOY_DIR}
      - COMPOSE_FILE=docker-compose.prod.yml
      - DOCKER_HOST=tcp://127.0.0.1:2375
      - CONFIG_AUDIT_LOG=${DEPLOY_DIR}/config-audit.log
    volumes:
      # No raw docker socket here — the webapp reaches Docker only via the proxy.
      # Deploy dir mounted read-write at its own host path (config edits + Apply).
      - ${DEPLOY_DIR}:${DEPLOY_DIR}

  brickd:
    image: ghcr.io/cme-research/cmexa_brickd:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: cmexa-brickd
    restart: unless-stopped
    network_mode: host
    privileged: true
    device_cgroup_rules:
      - 'c 189:* rmw'
    volumes:
      - /dev/bus/usb:/dev/bus/usb

  hardware:
    image: ghcr.io/cme-research/cmexa_hardware:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: ${ROBOT:-cmexaiii}-hardware
    restart: unless-stopped
    network_mode: host
    privileged: true
    ipc: host
    depends_on:
      mosquitto:
        condition: service_healthy
      brickd:
        condition: service_started
    volumes:
      - /dev/input:/dev/input
    device_cgroup_rules:
      - 'c 189:* rmw'
    group_add:
      - "${INPUT_GID}"
    environment:
      - ROBOT=${ROBOT:-cmexaiii}
      - ROBOT_ENV=${ROBOT_ENV:-house}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-12}
    # Select the robot's hardware launch. The image CMD is cmexaiii-specific, so
    # a non-cmexaiii robot MUST override it here (the baked CMD would otherwise
    # run the mecanum hardware launch regardless of ROBOT).
    command: ros2 launch cmeresearch_bringup ${HARDWARE_LAUNCH_FILE:-cmexaiii_hardware.launch.py}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ros2_control_node >/dev/null && pgrep -f robot_state_publisher >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  nav:
    image: ghcr.io/cme-research/cmexa_nav:${ROBOT_VERSION:?ROBOT_VERSION must be set (e.g. jazzy-0.1.0); run deploy.sh --version <distro>-<semver>}
    container_name: ${ROBOT:-cmexaiii}-nav
    restart: unless-stopped
    network_mode: host
    ipc: host
    profiles: ["nav"]
    depends_on:
      hardware:
        condition: service_healthy
    # nav must share the hardware container's DDS domain to see /scan + odom TF.
    environment:
      - ROBOT=${ROBOT:-cmexaiii}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-12}
    command: ros2 launch cmeresearch_bringup ${LAUNCH_FILE:-cmexaiii_nav_mapping.launch.py}
    volumes:
      - /robot/data/maps:/maps

volumes:
  mosquitto_data:
  mosquitto_log:
