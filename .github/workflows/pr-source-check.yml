name: PR Source Branch Check

on:
  pull_request:
    branches:
      - jazzy

jobs:
  verify-source:
    name: verify-source
    runs-on: ubuntu-latest
    steps:
      - name: Require head ref to be jazzy_dev
        run: |
          if [[ "${{ github.head_ref }}" != "jazzy_dev" ]]; then
            echo "::error::PRs into 'jazzy' must originate from 'jazzy_dev' (got '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is 'jazzy_dev' — OK."
