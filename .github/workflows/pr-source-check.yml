name: PR Source Branch Check

on:
  pull_request:
    branches:
      - jazzy

jobs:
  verify-source:
    name: verify-source
    runs-on: ubuntu-latest
    steps:
      - name: Require head ref to be jazzy_dev or a release-please branch
        run: |
          head="${{ github.head_ref }}"
          if [[ "$head" == "jazzy_dev" || "$head" == release-please--* ]]; then
            echo "Source branch '$head' is allowed — OK."
            exit 0
          fi
          echo "::error::PRs into 'jazzy' must originate from 'jazzy_dev' or a release-please branch (got '$head')."
          exit 1
