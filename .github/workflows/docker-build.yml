name: Docker Multi-Arch Build & Release

on:
  push:
    branches:
      - jazzy
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: cme-research

jobs:
  build:
    if: github.ref_type == 'branch'
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [hardware, nav]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/cmexa_${{ matrix.target }}
          tags: |
            type=raw,value=jazzy
            type=sha,prefix=jazzy-,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  promote:
    if: github.ref_type == 'tag'
    name: Promote ${{ matrix.target }} to ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [hardware, nav]
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "v=$v"                                 >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$v" | cut -d. -f1-2)"   >> "$GITHUB_OUTPUT"
          echo "major=$(echo "$v" | cut -d. -f1)"     >> "$GITHUB_OUTPUT"

      - name: Retag jazzy-<sha> manifest as versioned release
        env:
          IMG: ${{ env.REGISTRY }}/${{ env.ORG }}/cmexa_${{ matrix.target }}
          SHA: ${{ github.sha }}
          V:   ${{ steps.ver.outputs.v }}
          MIN: ${{ steps.ver.outputs.minor }}
          MAJ: ${{ steps.ver.outputs.major }}
        run: |
          set -euo pipefail
          src="${IMG}:jazzy-${SHA}"
          if ! docker buildx imagetools inspect "${src}" >/dev/null 2>&1; then
            echo "::error::Source image ${src} not found. Tag a commit that has been merged to jazzy and built by the 'build' job."
            exit 1
          fi
          args=(-t "${IMG}:${V}" -t "${IMG}:${MIN}" -t "${IMG}:${MAJ}")
          # Only mark stable releases as 'latest' (skip pre-releases like v1.2.3-rc1).
          if [[ "$V" != *-* ]]; then
            args+=(-t "${IMG}:latest")
          fi
          docker buildx imagetools create "${args[@]}" "${src}"
