name: PR Test

on:
  pull_request:
    branches:
      - jazzy
      - jazzy_dev

jobs:
  colcon-build:
    name: colcon build
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy-ros-base-noble
    env:
      # Noble's Python 3.12 enforces PEP 668. rosdep installs some pip
      # keys, which fails without this. Mirrors the Dockerfile.
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    steps:
      - name: Install build tooling
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            build-essential git \
            python3-colcon-common-extensions \
            python3-rosdep python3-vcstool \
            python3-pip python3-yaml

      - name: Checkout cmexa_install (PR head)
        uses: actions/checkout@v4
        with:
          path: src/cmexa_install

      - name: cmexa_install unit tests (render_config)
        run: python3 src/cmexa_install/scripts/test_render_config.py

      - name: Merge docker/*.repos into one import file
        # Build a single .repos that unions hardware.repos + nav.repos so the
        # PR build exercises the exact SHAs that will land in the production
        # images. Overlapping entries (cmeresearch_bringup, cmeresearch_msgs)
        # are deduplicated; SHA-mismatch between files fails the job loudly.
        run: |
          python3 <<'PY'
          import yaml, sys
          out = {"repositories": {}}
          for path in ["src/cmexa_install/docker/hardware.repos",
                       "src/cmexa_install/docker/nav.repos"]:
              data = yaml.safe_load(open(path)) or {}
              for name, meta in (data.get("repositories") or {}).items():
                  if name in out["repositories"] and out["repositories"][name] != meta:
                      sys.exit(f"SHA mismatch for {name} between docker/*.repos files")
                  out["repositories"][name] = meta
          yaml.safe_dump(out, open("/tmp/merged.repos", "w"), sort_keys=False)
          PY

      - name: vcs import sources
        run: |
          vcs import src < /tmp/merged.repos

      - name: rosdep install
        shell: bash
        run: |
          rosdep update
          rosdep install -y -r --from-paths src --ignore-src --rosdistro=jazzy \
            --skip-keys "nav2_bringup slam_toolbox rviz2 web_video_server"

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+

      # Run every package's tests against the exact pinned SHAs, so a SHA bump
      # that breaks one repo's behaviour in combination with another fails here
      # before images are built. ament linters (ctest label / pytest marker
      # "linter") are excluded, matching the per-repo CI.
      - name: colcon test
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: "1"
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ \
            --ctest-args -LE linter \
            --pytest-args -m "not linter" \
            --return-code-on-test-failure

      - name: colcon test-result
        if: always()
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test-result --verbose

  # Build the real hardware/nav images (amd64) and run docker/smoke_test.sh inside
  # them: the launch files compose uses must load and every executable/package they
  # reference must be in the image (catches missing install rules or run-time
  # dependencies that the colcon test job cannot see, since images skip test deps).
  image-smoke-test:
    name: image smoke test (${{ matrix.target }}, amd64)
    needs: colcon-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hardware, nav]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: cmexa-${{ matrix.target }}:smoke
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Run smoke test inside the image
        run: |
          docker run --rm \
            -v "$PWD/docker/smoke_test.sh:/smoke_test.sh:ro" \
            cmexa-${{ matrix.target }}:smoke bash /smoke_test.sh ${{ matrix.target }}

      - name: Image size
        if: always()
        run: docker image ls cmexa-${{ matrix.target }}:smoke

  docker-build:
    name: docker multi-arch (no push)
    needs: colcon-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [hardware, nav, brickd]
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
