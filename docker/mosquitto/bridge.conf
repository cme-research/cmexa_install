# =============================================================================
# Mosquitto Bridge Configuration
# Local broker bridging to remote broker
# Place at: /etc/mosquitto/conf.d/bridge.conf
# =============================================================================

# ── Local broker listener ────────────────────────────────────────────────────
# Bind to all interfaces. Restricting to "localhost" only listens on 127.0.0.1
# inside the container's network namespace — the docker port mapping 1883:1883
# then routes host:1883 → container eth0:1883, where nothing listens, so
# every external client (webapp, mqtt_bridge in the hardware container) gets
# Connection Refused. The healthcheck still passes because mosquitto_sub
# runs inside the same container and reaches 127.0.0.1 directly, masking
# the bug.
listener 1883
allow_anonymous true

# ── Bridge connection ─────────────────────────────────────────────────────────
connection bridge_to_remote

# Remote broker address and port
address 10.8.0.1:1883

# Bridge protocol version (mqttv311 recommended for compatibility)
bridge_protocol_version mqttv311

# Unique client ID for this bridge on the remote broker
remote_clientid cmexaiii_bridge

# Optional: credentials if remote broker requires authentication
# remote_username your_username
# remote_password your_password

# ── Topic mappings ────────────────────────────────────────────────────────────
# Syntax: topic <pattern> <direction> <qos> <local_prefix> <remote_prefix>
# direction: in, out, both
# Use # to wildcard all subtopics

# Forward all robot topics to remote broker
topic cmeresearch/cmexaiii-001/# out 1

# Receive commands from remote broker
topic cmexaiii/cmd/# in 1

# Bidirectional sync for a specific topic
# topic cmexaiii/status both 1

# ── Connection reliability ────────────────────────────────────────────────────
# Seconds between reconnection attempts
restart_timeout 5

# Keep-alive interval in seconds
keepalive_interval 60

# Resend unacknowledged QoS > 0 messages after this many seconds
idle_timeout 60

# Try to reconnect even if the remote broker is unavailable at startup
try_private false
notifications false

# ── TLS (uncomment if remote broker uses TLS) ────────────────────────────────
# bridge_tls_version tlsv1.2
# bridge_cafile /etc/mosquitto/certs/ca.crt
# bridge_certfile /etc/mosquitto/certs/client.crt
# bridge_keyfile /etc/mosquitto/certs/client.key
